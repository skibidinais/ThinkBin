<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Plopp - Ready for focus & Leaderboard</title>
  <!-- Google Fonts: Nunito / Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../shared/navbar.css" />
  <script src="../shared/navbar.js" defer></script>
</head>
<body>
  <!-- Top Screen Switcher Toolbar -->
  <div class="screen-switcher-bar">
    <button class="switch-screen-btn" id="btnShowSignup" onclick="showScreen('signup')">
      🚀 Screen 1: Focus Onboarding
    </button>
    <button class="switch-screen-btn active" id="btnShowLeaderboard" onclick="showScreen('leaderboard')">
      🏆 Screen 2: Golden Leaderboard
    </button>
  </div>

  <div class="screen-wrapper">
    <div class="phone-container" id="phoneApp">
      
      <!-- =========================================================
           SCREEN 1: READY FOR FOCUS? (SIGN UP / ONBOARDING)
           ========================================================= -->
      <div class="app-screen screen-signup" id="signupScreen">
        <div class="signup-content">
          
          <!-- Top Mascot Illustration (Waving Pose #12) -->
          <div class="signup-mascot-wrapper" onclick="triggerSignupMascotCheer()">
            <div class="mascot-waving-container" id="signupMascotBox">
              <!-- Injected High-Res Mascot Sprite -->
            </div>
            <!-- Waving motion lines SVG -->
            <div class="waving-arcs">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M5 4C9 7 9 17 5 20" stroke="#72a61c" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M12 2C17 6 17 18 12 22" stroke="#72a61c" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </div>
          </div>

          <!-- Main Title -->
          <h1 class="signup-title">Ready for focus?</h1>

          <!-- Form Fields -->
          <form class="signup-form" onsubmit="handleSignupSubmit(event)">
            <div class="input-group">
              <input type="text" class="plopp-input" id="inputName" placeholder="Your Name" required autocomplete="name" />
            </div>

            <div class="input-group">
              <input type="email" class="plopp-input" id="inputEmail" placeholder="Email" required autocomplete="email" />
            </div>

            <div class="input-group">
              <input type="password" class="plopp-input" id="inputPassword" placeholder="Password" required autocomplete="current-password" />
            </div>

            <!-- Social Logins Row -->
            <div class="social-login-row">
              <!-- Facebook Button -->
              <button type="button" class="social-btn facebook-btn" onclick="handleSocialLogin('Facebook')">
                <span class="social-icon fb-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                  </svg>
                </span>
                <span class="social-text">Facebook</span>
              </button>

              <!-- Google Button -->
              <button type="button" class="social-btn google-btn" onclick="handleSocialLogin('Google')">
                <span class="social-icon google-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21.35 11.1h-9.17v2.98h5.27c-.23 1.25-.94 2.31-2 3.02v2.51h3.24c1.89-1.74 2.98-4.3 2.98-7.39 0-.71-.06-1.4-.18-2.02l-.14-1.1z" fill="#ffffff"/>
                    <path d="M12.18 21.5c2.7 0 4.96-.9 6.62-2.43l-3.24-2.51c-.9.6-2.04.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.24v2.59C4.88 19.24 8.28 21.5 12.18 21.5z" fill="#ffffff"/>
                    <path d="M6.59 13.4c-.2-.6-.31-1.25-.31-1.9s.11-1.3.31-1.9V7.01H3.24C2.58 8.33 2.2 9.87 2.2 11.5s.38 3.17 1.04 4.49l3.35-2.59z" fill="#ffffff"/>
                    <path d="M12.18 5.48c1.47 0 2.79.51 3.82 1.5l2.86-2.86C17.13 2.5 14.87 1.5 12.18 1.5 8.28 1.5 4.88 3.76 3.24 6.99l3.35 2.59c.79-2.36 2.99-4.1 5.59-4.1z" fill="#ffffff"/>
                  </svg>
                </span>
                <span class="social-text">Google</span>
              </button>
            </div>

            <!-- Main CTA Button -->
            <button type="submit" class="plopp-cta-btn" id="btnLetsPlopp">
              Let's Plopp!
            </button>
          </form>

          <!-- Footer Text -->
          <div class="signup-footer">
            <p class="signin-text">
              Already have an account? <a href="javascript:void(0)" onclick="showScreen('leaderboard')" class="signin-link">Sign in</a>
            </p>
          </div>

        </div>
      </div>


      <!-- =========================================================
           SCREEN 2: LEADERBOARD - GOLDEN LEAGUE
           ========================================================= -->
      <div class="app-screen screen-leaderboard active" id="leaderboardScreen">
        
        <!-- Authentic Scenery Backdrop & Animated Floating Clouds -->
        <div class="scenery-background-layer">
          <div class="cloud-layer">
            <div class="animated-cloud cloud-drift-1"></div>
            <div class="animated-cloud cloud-drift-2"></div>
            <div class="animated-cloud cloud-drift-3"></div>
            <div class="animated-cloud cloud-drift-4"></div>
          </div>
        </div>

        <!-- Main Scrollable Content -->
        <div class="app-content-scroll">
          
          <!-- HEADER SECTION -->
          <header class="app-header">
            <div class="header-left">
              <h1 class="header-title">Leaderboard</h1>
            </div>

            <div class="header-right">
              <!-- Coins Pill -->
              <div class="stat-pill coins-pill" id="coinBadge" title="Koin">
                <span class="coin-icon">
                  <img src="assets/coin.png" alt="Coin" width="20" height="20" style="object-fit: contain; display: block;">
                </span>
                <span class="stat-value" id="coinsValue">640</span>
              </div>

              <!-- Energy XP Pill -->
              <div class="stat-pill energy-pill" id="energyBadge" title="Energy / XP">
                <span class="bolt-icon">
                  <img src="assets/xp_icon.png" alt="XP Icon" width="18" height="18" style="object-fit: contain; display: block;">
                </span>
                <span class="stat-value" id="energyValue">252</span>
              </div>
            </div>
          </header>

          <!-- TOP 3 PODIUM SECTION -->
          <section class="podium-stage">
            <div class="podium-container">
              
              <!-- RANK 2: LEONARDO (Left Stump) -->
              <div class="podium-column rank-2-col" id="colLeonardo">
                <div class="mascot-frame mascot-leonardo">
                  <div class="mascot-img-container" id="leonardoMascotBox">
                    <!-- Injected exact transparent mascot sprite -->
                  </div>
                </div>

                <!-- Tree Stump 2 -->
                <div class="tree-stump stump-2">
                  <div class="stump-top">
                    <div class="wood-rings"></div>
                  </div>
                  <div class="stump-bark">
                    <div class="bark-sprout left-sprout">
                      <div class="twig"></div>
                      <div class="leaf leaf-1"></div>
                      <div class="leaf leaf-2"></div>
                    </div>
                    <!-- Medal Rank 2 -->
                    <div class="medal-badge medal-2">
                      <span class="medal-num">2</span>
                    </div>
                    <div class="stump-user-name" id="p2Name">Leonardo</div>
                    <div class="stump-xp">
                      <img src="assets/xp_icon.png" alt="XP" width="14" height="14" style="object-fit: contain; vertical-align: middle; margin-right: 3px;"> <span id="p2Xp">214 XP</span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- RANK 1: MAX (Center Tallest Stump) -->
              <div class="podium-column rank-1-col" id="colMax">
                <div class="mascot-frame mascot-max">
                  <div class="mascot-img-container" id="maxMascotBox">
                    <!-- Injected exact transparent mascot sprite -->
                  </div>
                </div>

                <!-- Tree Stump 1 (Tallest) -->
                <div class="tree-stump stump-1">
                  <div class="stump-top">
                    <div class="wood-rings"></div>
                  </div>
                  <div class="stump-bark">
                    <!-- Medal Rank 1 -->
                    <div class="medal-badge medal-1">
                      <span class="medal-num">1</span>
                    </div>
                    <div class="stump-user-name" id="p1Name">Max</div>
                    <div class="stump-xp">
                      <img src="assets/xp_icon.png" alt="XP" width="14" height="14" style="object-fit: contain; vertical-align: middle; margin-right: 3px;"> <span id="p1Xp">234 XP</span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- RANK 3: SUSAN (Right Stump) -->
              <div class="podium-column rank-3-col" id="colSusan">
                <!-- Floating Love Hearts -->
                <div class="floating-hearts">
                  <span class="heart h1">❤️</span>
                  <span class="heart h2">❤️</span>
                  <span class="heart h3">💖</span>
                </div>

                <div class="mascot-frame mascot-susan">
                  <div class="mascot-img-container" id="susanMascotBox">
                    <!-- Injected exact transparent mascot sprite -->
                  </div>
                </div>

                <!-- Tree Stump 3 -->
                <div class="tree-stump stump-3">
                  <div class="stump-top">
                    <div class="wood-rings"></div>
                  </div>
                  <div class="stump-bark">
                    <div class="bark-sprout right-sprout">
                      <div class="twig"></div>
                      <div class="leaf leaf-1"></div>
                      <div class="leaf leaf-2"></div>
                    </div>
                    <!-- Medal Rank 3 -->
                    <div class="medal-badge medal-3">
                      <span class="medal-num">3</span>
                    </div>
                    <div class="stump-user-name" id="p3Name">Susan</div>
                    <div class="stump-xp">
                      <img src="assets/xp_icon.png" alt="XP" width="14" height="14" style="object-fit: contain; vertical-align: middle; margin-right: 3px;"> <span id="p3Xp">204 XP</span>
                    </div>
                  </div>
                </div>
              </div>

            </div>

            <!-- Scalloped Cloud Base Transition -->
            <div class="scalloped-cloud-divider">
              <svg viewBox="0 0 375 28" fill="none" preserveAspectRatio="none">
                <path d="M0 28H375V16C360 16 352 6 338 6C324 6 316 16 302 16C288 16 280 6 266 6C252 6 244 16 230 16C216 16 208 6 194 6C180 6 172 16 158 16C144 16 136 6 122 6C108 6 100 16 86 16C72 16 64 6 50 6C36 6 28 16 14 16C6 16 0 12 0 12V28Z" fill="#ffffff"/>
              </svg>
            </div>
          </section>

          <!-- LEADERBOARD LIST SECTION (Ranks 4 - 8+) -->
          <section class="leaderboard-list-card">
            <div class="list-rows-container" id="leaderboardList">
              
              <!-- Rank 4: Aroma -->
              <div class="rank-row">
                <div class="rank-badge-wrap">
                  <div class="silver-disc-badge">
                    <span class="disc-num">4</span>
                  </div>
                </div>
                <div class="user-info">
                  <span class="user-name" id="r4Name">Aroma</span>
                </div>
                <div class="user-xp">
                  <img src="assets/xp_icon.png" alt="XP" width="16" height="16" style="object-fit: contain; vertical-align: middle; margin-right: 3px;">
                  <span class="xp-val" id="r4Xp">173 XP</span>
                </div>
              </div>

              <!-- Rank 5: You (Active Highlight) -->
              <div class="rank-row current-user-row" onclick="openMyProfile()" style="cursor: pointer;" title="Lihat Profil Saya">
                <div class="rank-badge-wrap">
                  <div class="silver-disc-badge">
                    <span class="disc-num">5</span>
                  </div>
                </div>
                <div class="user-info">
                  <span class="user-name you-name" id="r5Name">You</span>
                </div>
                <div class="user-xp">
                  <img src="assets/xp_icon.png" alt="XP" width="16" height="16" style="object-fit: contain; vertical-align: middle; margin-right: 3px;">
                  <span class="xp-val" id="r5Xp">123 XP</span>
                </div>
              </div>

              <!-- Rank 6: James -->
              <div class="rank-row">
                <div class="rank-badge-wrap">
                  <div class="silver-disc-badge">
                    <span class="disc-num">6</span>
                  </div>
                </div>
                <div class="user-info">
                  <span class="user-name" id="r6Name">James</span>
                </div>
                <div class="user-xp">
                  <img src="assets/xp_icon.png" alt="XP" width="16" height="16" style="object-fit: contain; vertical-align: middle; margin-right: 3px;">
                  <span class="xp-val" id="r6Xp">98 XP</span>
                </div>
              </div>

              <!-- Rank 7: William -->
              <div class="rank-row">
                <div class="rank-badge-wrap">
                  <div class="silver-disc-badge">
                    <span class="disc-num">7</span>
                  </div>
                </div>
                <div class="user-info">
                  <span class="user-name" id="r7Name">William</span>
                </div>
                <div class="user-xp">
                  <img src="assets/xp_icon.png" alt="XP" width="16" height="16" style="object-fit: contain; vertical-align: middle; margin-right: 3px;">
                  <span class="xp-val" id="r7Xp">76 XP</span>
                </div>
              </div>

              <!-- Rank 8: Chloe -->
              <div class="rank-row">
                <div class="rank-badge-wrap">
                  <div class="silver-disc-badge">
                    <span class="disc-num">8</span>
                  </div>
                </div>
                <div class="user-info">
                  <span class="user-name" id="r8Name">Chloe</span>
                </div>
                <div class="user-xp">
                  <img src="assets/xp_icon.png" alt="XP" width="16" height="16" style="object-fit: contain; vertical-align: middle; margin-right: 3px;">
                  <span class="xp-val" id="r8Xp">65 XP</span>
                </div>
              </div>

            </div>
          </section>

        </div> <!-- End Scroll Content -->

        <!-- BOTTOM NAVIGATION DOCK (GLOBAL THINKBIN NAV) -->
        <div class="global-nav-container">
          <div class="global-navbar" id="navbar">
            <div class="global-active-indicator" id="active-indicator"></div>
            
            <!-- Nav Item 1: Beranda -->
            <button class="global-nav-item" data-screen="home" data-index="0">
              <div class="global-icon-wrapper">
                <img src="assets/home.png" alt="Beranda">
              </div>
              <span class="global-nav-text">Beranda</span>
            </button>

            <!-- Nav Item 2: Belajar -->
            <button class="global-nav-item" data-screen="learning-map" data-index="1">
              <div class="global-icon-wrapper">
                <img src="assets/learn.png" alt="Belajar">
              </div>
              <span class="global-nav-text">Belajar</span>
            </button>

            <!-- Nav Item 3: Papan Peringkat (Active) -->
            <button class="global-nav-item active" data-screen="plopp" data-index="2">
              <div class="global-icon-wrapper">
                <img src="assets/leaderboard.png" alt="Papan Peringkat">
              </div>
              <span class="global-nav-text">Peringkat</span>
            </button>

            <!-- Nav Item 4: Toko -->
            <button class="global-nav-item" data-screen="toko" data-index="3">
              <div class="global-icon-wrapper">
                <img src="assets/shop.png" alt="Toko">
              </div>
              <span class="global-nav-text">Toko</span>
            </button>

            <!-- Nav Item 5: Profil -->
            <button class="global-nav-item" data-screen="profile" data-index="4">
              <div class="global-icon-wrapper">
                <img src="assets/profile.png" alt="Profil">
              </div>
              <span class="global-nav-text">Profil</span>
            </button>
          </div>
        </div>

        <!-- USER PROFILE INSPECTION MODAL -->
        <div class="user-profile-modal-backdrop" id="userProfileModal" onclick="handleBackdropClick(event)">
          <div class="user-profile-modal-card">
            <button class="modal-close-icon" onclick="closeUserProfileModal()">✕</button>
            <div class="modal-profile-header">
              <div class="modal-avatar-container">
                <div class="modal-avatar-square">
                  <img src="" id="modalUserAvatar" alt="Avatar">
                </div>
                <img src="" id="modalUserBorder" class="modal-avatar-border" alt="Border Frame">
              </div>
              <h2 class="modal-user-display-name" id="modalUserName">Nama</h2>
              <div class="modal-rank-badge" id="modalUserRank">Juara Lingkungan</div>
            </div>

            <div class="modal-stats-row">
              <div class="modal-stat-card">
                <span class="m-stat-val" id="modalUserStreak">0 Hari</span>
                <span class="m-stat-lbl">Streak</span>
              </div>
              <div class="modal-stat-card">
                <span class="m-stat-val" id="modalUserXp">0</span>
                <span class="m-stat-lbl">Total XP</span>
              </div>
              <div class="modal-stat-card">
                <span class="m-stat-val" id="modalUserCoins">0</span>
                <span class="m-stat-lbl">Koin</span>
              </div>
            </div>

            <button class="modal-close-btn" onclick="closeUserProfileModal()">
              Tutup
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
