<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ThinkBin - User Profile</title>
  <!-- Google Fonts: Fredoka & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- Icons library (FontAwesome) -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shared/navbar.css">
  <script src="../shared/navbar.js" defer></script>
</head>
<body>

  <!-- Canvas for celebration particles -->
  <canvas id="confetti-canvas"></canvas>

  <div class="screen-container">

    <!-- Fixed Header -->
    <header class="app-header">
      <div class="header-left">
        <button class="btn-back" id="btn-back-profile" title="Kembali">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#382C22" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <h1 class="header-title">Profil Saya</h1>
      </div>
    </header>

    <!-- Main Scrollable Profile Feed Container -->
    <main class="content-scroll">
      
      <!-- CARD 1: PROFILE HERO BANNER CARD WITH LANDSCAPE BACKGROUND -->
      <div class="card profile-hero-card">
        <div class="hero-bg-wrapper">
          <img src="assets/hero_bg.jpg" alt="Profile Landscape Banner" class="hero-landscape-img">
        </div>
        <div class="hero-card-content">
          <!-- Square User Avatar with border overlay & camera trigger -->
          <div class="avatar-container">
            <div class="avatar-circle" id="profile-avatar-bg">
              <img src="assets/mascot_thumbsup_transparent.png" alt="User Avatar" id="profile-avatar-img">
            </div>
            
            <!-- Equipped Avatar Border Frame Overlay -->
            <img src="" id="profile-avatar-border-img" class="profile-avatar-border-overlay" alt="Border Frame">

            <!-- Hidden file input uploader -->
            <input type="file" id="avatar-file-input" accept="image/*" style="display: none;">
            
            <button class="avatar-edit-btn" id="avatar-edit-trigger" title="Upload Foto">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </button>
          </div>

          <!-- Centered Name -->
          <div class="hero-user-details">
            <span class="user-name" id="user-display-name-val">Raka</span>
          </div>

          <!-- Centered Level Progress Bar -->
          <div class="hero-progress-container">
            <div class="hero-progress-bar-track">
              <div class="hero-progress-bar-fill" id="hero-xp-fill" style="width: 16.67%;"></div>
            </div>
            <span class="hero-progress-text" id="hero-xp-text">250 / 1.500 XP</span>
          </div>
        </div>
      </div>

      <!-- CARD 2: THREE SEPARATE SQUARE STATS CARDS -->
      <div class="stats-squares-row">
        <!-- Square 1: Streak -->
        <div class="card stat-square-card">
          <div class="square-icon-container box-orange">
            <img src="assets/streak_icon.png" alt="Streak Icon" class="square-icon">
          </div>
          <span class="square-num" id="stat-square-streak-val">7 Hari</span>
          <span class="square-label">Streak</span>
        </div>

        <!-- Square 2: XP -->
        <div class="card stat-square-card">
          <div class="square-icon-container box-yellow xp-icon-box">
            <img src="assets/xp_icon.png" alt="XP Icon" class="square-icon">
          </div>
          <span class="square-num" id="stat-square-xp-val">1.250</span>
          <span class="square-label">XP</span>
        </div>

        <!-- Square 3: Koin -->
        <div class="card stat-square-card">
          <div class="square-icon-container box-green">
            <img src="assets/leaf_coin.jpg" alt="Coin Icon" class="square-icon">
          </div>
          <span class="square-num" id="stat-square-coin-val">640</span>
          <span class="square-label">Koin</span>
        </div>
      </div>

      <!-- CARD 2.5: BORDER AVATAR COLLECTION & SWITCHER -->
      <div class="card border-collection-card" id="borderCollectionCard">
        <div class="border-card-header">
          <div class="border-header-left">
            <span class="border-top-lbl">BORDER AVATAR</span>
            <div class="border-title">Pasang & Koleksi Border</div>
          </div>
        </div>
        <div class="borders-scroll-grid" id="ownedBordersGrid">
          <!-- Populated dynamically: default (no border) + purchased borders -->
        </div>
      </div>

      <!-- CARD 3: ACTIVE RANK CARD -->
      <div class="card active-rank-card">
        <div class="rank-card-content">
          <!-- Left details -->
          <div class="rank-left">
            <span class="rank-top-lbl">RANK SAAT INI</span>
            <div class="rank-title" id="rank-card-title-val">Explorer</div>
            
            <!-- XP Progress -->
            <div class="rank-xp-wrapper">
              <span class="xp-bubble">XP</span>
              <div class="rank-bar-track">
                <div class="rank-bar-fill" id="rank-card-bar-fill" style="width: 69.44%;"></div>
              </div>
              <span class="xp-numbers-lbl" id="rank-card-xp-lbl">1.250 / 1.800</span>
            </div>
          </div>

          <!-- Right Large Badge -->
          <div class="rank-right-badge">
            <img src="assets/badge_explorer.jpg" alt="Active Rank Badge" id="rank-card-badge-img">
          </div>
        </div>
      </div>

      <!-- CARD 4: JALUR RANK PATH CARD (5 badges in order) -->
      <div class="card jalur-rank-card">
        <div class="section-title">
          Jalur Rank
        </div>
        
        <div class="jalur-path-wrapper">
          <!-- Rookie Rank -->
          <div class="jalur-badge-item" id="jalur-rookie" data-rank="Rookie">
            <div class="badge-frame">
              <img src="assets/badge_rookie.jpg" alt="Rookie Badge">
            </div>
            <span class="name">Rookie</span>
          </div>

          <div class="jalur-arrow">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>

          <!-- Explorer Rank -->
          <div class="jalur-badge-item" id="jalur-explorer" data-rank="Explorer">
            <div class="badge-frame">
              <img src="assets/badge_explorer.jpg" alt="Explorer Badge">
            </div>
            <span class="name">Explorer</span>
          </div>

          <div class="jalur-arrow">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>

          <!-- Guardian Rank -->
          <div class="jalur-badge-item" id="jalur-guardian" data-rank="Guardian">
            <div class="badge-frame">
              <img src="assets/badge_guardian.jpg" alt="Guardian Badge">
            </div>
            <span class="name">Guardian</span>
          </div>

          <div class="jalur-arrow">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>

          <!-- Warrior Rank -->
          <div class="jalur-badge-item" id="jalur-warrior" data-rank="Warrior">
            <div class="badge-frame">
              <img src="assets/badge_warrior.jpg" alt="Warrior Badge">
            </div>
            <span class="name">Warrior</span>
          </div>

          <div class="jalur-arrow">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>

          <!-- Champion Rank -->
          <div class="jalur-badge-item" id="jalur-champion" data-rank="Champion">
            <div class="badge-frame">
              <img src="assets/badge_champion.jpg" alt="Champion Badge">
            </div>
            <span class="name">Champion</span>
          </div>
        </div>
      </div>

    </main>

    <!-- Fixed Bottom Navigation Bar (GLOBAL THINKBIN NAV) -->
    <div class="global-nav-container">
      <div class="global-navbar" id="navbar">
        <div class="global-active-indicator" id="active-indicator"></div>
        
        <!-- Nav Item 1: Beranda -->
        <button class="global-nav-item" data-screen="home" data-index="0">
          <div class="global-icon-wrapper">
            <img src="assets/home.png" alt="Beranda">
          </div>
          <span class="global-nav-text">Beranda</span>
        </button>

        <!-- Nav Item 2: Belajar -->
        <button class="global-nav-item" data-screen="learning-map" data-index="1">
          <div class="global-icon-wrapper">
            <img src="assets/learn.png" alt="Belajar">
          </div>
          <span class="global-nav-text">Belajar</span>
        </button>

        <!-- Nav Item 3: Papan Peringkat -->
        <button class="global-nav-item" data-screen="plopp" data-index="2">
          <div class="global-icon-wrapper">
            <img src="assets/leaderboard.png" alt="Papan Peringkat">
          </div>
          <span class="global-nav-text">Peringkat</span>
        </button>

        <!-- Nav Item 4: Toko -->
        <button class="global-nav-item" data-screen="toko" data-index="3">
          <div class="global-icon-wrapper">
            <img src="assets/shop.png" alt="Toko">
          </div>
          <span class="global-nav-text">Toko</span>
        </button>

        <!-- Nav Item 5: Profil (Active) -->
        <button class="global-nav-item active" data-screen="profile" data-index="4">
          <div class="global-icon-wrapper">
            <img src="assets/profile.png" alt="Profil">
          </div>
          <span class="global-nav-text">Profil</span>
        </button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
