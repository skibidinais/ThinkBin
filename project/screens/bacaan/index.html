<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Think Bin - Halaman Bacaan</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen-wrapper">
    <div class="mobile-frame">
      
      <!-- Top Decorative Sticky Notes & Stationery Behind Paper -->
      <div class="decorations-layer">
        <!-- Orange Sticky Note -->
        <div class="sticky-note sticky-orange"></div>
        <!-- Yellow Sticky Note -->
        <div class="sticky-note sticky-yellow"></div>
        <!-- Light Green Sticky Note -->
        <div class="sticky-note sticky-green"></div>
        
        <!-- Ruler on top right -->
        <div class="ruler-prop">
          <div class="ruler-marks">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <!-- Green Crayon on Left -->
        <div class="prop-crayon">
          <div class="crayon-tip"></div>
          <div class="crayon-body">
            <div class="crayon-pattern">
              <div class="crayon-circle"></div>
            </div>
            <div class="crayon-stripe top"></div>
            <div class="crayon-stripe bot"></div>
          </div>
        </div>

        <!-- Black Pencil on Left -->
        <div class="prop-pencil">
          <div class="pencil-body"></div>
          <div class="pencil-wood"></div>
          <div class="pencil-tip"></div>
        </div>

        <!-- White Eraser on Right -->
        <div class="prop-eraser">
          <div class="eraser-white"></div>
          <div class="eraser-sleeve"></div>
        </div>
      </div>

      <!-- Top Bar Header (Back button + Logo) -->
      <header class="top-bar">
        <button class="back-btn" id="backBtn" aria-label="Kembali" title="Kembali">
          <svg viewBox="0 0 24 24" class="icon-arrow">
            <path d="M15 19l-7-7 7-7" fill="none" stroke="#683407" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="logo-card">
          <img src="logo.png" alt="Think Bin Logo" class="brand-logo" id="brandLogo">
        </div>
      </header>

      <!-- Main Paper Reading Container -->
      <main class="paper-container" id="paperContainer">
        
        <!-- Pill: Reading Counter badge (Bacaan 1 / 4) -->
        <div class="question-pill" id="readingPill">
          <span id="readingCounter">Bacaan 1 / 4</span>
        </div>

        <!-- Audio Listen / Read-aloud button without icon -->
        <button class="audio-btn" id="audioBtn" title="Dengarkan Bacaan">
          <span id="audioText">Dengar Suara</span>
        </button>

        <!-- Reading Wrapper Card Area -->
        <div class="reading-wrapper" id="readingWrapper">
          <!-- Passage Header (Topic Title without number circle) -->
          <div class="reading-header">
            <h2 class="reading-title" id="readingTitle">Mengenal Masalah Sampah</h2>
          </div>

          <!-- Scrollable Text Passage Content Area -->
          <div class="passage-scrollable" id="passageScrollArea">
            <div class="passage-body" id="passageContent">
              <!-- Reading text populated dynamically -->
            </div>
          </div>

          <!-- Action Button: LANJUT -->
          <div class="submit-wrapper">
            <button class="btn-jawaban" id="btnNext">
              LANJUT
            </button>
          </div>
        </div>

        <!-- Completed Screen (After finishing all reading passages) -->
        <div class="reading-complete hidden" id="completeContent">
          <div class="result-mascot">
            <img src="logo.png" alt="Think Bin" class="result-logo-img">
          </div>
          <h2 class="complete-title" id="completeTitle">Bacaan Selesai</h2>
          <div class="complete-badge">Materi Selesai Dibaca</div>
          <p class="complete-feedback" id="completeFeedback">Hebat! Kamu telah menyelesaikan seluruh materi bacaan. Sekarang kamu siap menguji pengetahuanmu!</p>
          
          <div class="result-buttons-row">
            <button class="btn-jawaban btn-restart" id="btnReread">
              BACA LAGI
            </button>
            <button class="btn-jawaban btn-continue" id="btnToQuiz">
              MULAI KUIS →
            </button>
          </div>
        </div>

      </main>

    </div>
  </div>

  <!-- Load Curriculum Data -->
  <script src="../shared/modul_data.js"></script>
  <script src="script.js"></script>
</body>
</html>
