<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kuisioner ThinkBin</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../quiz/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen-wrapper">
    <div class="mobile-frame">
      
      <!-- Top Decorative Sticky Notes & Stationery Behind Paper -->
      <div class="decorations-layer">
        <div class="sticky-note sticky-orange"></div>
        <div class="sticky-note sticky-yellow"></div>
        <div class="sticky-note sticky-green"></div>
        
        <!-- Ruler on top right -->
        <div class="ruler-prop">
          <div class="ruler-marks">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <!-- Green Crayon on Left -->
        <div class="prop-crayon">
          <div class="crayon-tip"></div>
          <div class="crayon-body">
            <div class="crayon-pattern">
              <div class="crayon-circle"></div>
            </div>
            <div class="crayon-stripe top"></div>
            <div class="crayon-stripe bot"></div>
          </div>
        </div>

        <!-- Black Pencil on Left -->
        <div class="prop-pencil">
          <div class="pencil-body"></div>
          <div class="pencil-wood"></div>
          <div class="pencil-tip"></div>
        </div>

        <!-- White Eraser on Right -->
        <div class="prop-eraser">
          <div class="eraser-white"></div>
          <div class="eraser-sleeve"></div>
        </div>
      </div>

      <!-- Top Bar Header (Back button + Logo) -->
      <header class="top-bar">
        <button class="back-btn" id="backBtn" aria-label="Kembali" title="Kembali">
          <svg viewBox="0 0 24 24" class="icon-arrow">
            <path d="M15 19l-7-7 7-7" fill="none" stroke="#683407" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="logo-card">
          <img src="../quiz/logo.png" alt="Think Bin Logo" class="brand-logo" id="brandLogo">
        </div>
      </header>

      <!-- Main Paper Quiz Container -->
      <main class="paper-container" id="paperContainer">
        
        <!-- Floating Pill: Question Counter badge -->
        <div class="question-pill" id="questionPill">
          <span id="questionCounter">Soal 1 / 4</span>
        </div>

        <!-- Pill: Subtitle Badge (Kuisioner Awal / Akhir) -->
        <div class="survey-badge-pill" id="surveyTypeBadge">
          <span>Kuisioner Awal</span>
        </div>

        <!-- Quiz Body Card Area -->
        <div class="quiz-content" id="quizContent">
          <!-- Question Row -->
          <div class="question-header">
            <div class="question-num-circle" id="qNumberCircle">1</div>
            <h2 class="question-text" id="questionText">Memuat pertanyaan...</h2>
          </div>

          <!-- Answer Options List (Using exact quiz option-item markup) -->
          <div class="options-list" id="optionsList">
            <!-- Dynamically populated options -->
          </div>

          <!-- Action Button: LANJUT / SELESAI -->
          <div class="submit-wrapper">
            <button class="btn-jawaban" id="btnNextQuestion" disabled>
              LANJUT
            </button>
          </div>
        </div>

        <!-- Result / Completion Screen -->
        <div class="result-content hidden" id="resultContent">
          <div class="result-mascot">
            <img src="logo.png" alt="Think Bin" class="result-logo-img">
          </div>
          <h2 class="result-title" id="resultTitle">Terima Kasih!</h2>
          <p class="result-feedback" id="resultFeedback">
            Jawaban kuisionermu telah tersimpan.
          </p>

          <!-- Reward Badges (+30 Koin & +20 XP) -->
          <div class="survey-rewards-container">
            <div class="reward-pill reward-coin">
              <span class="r-icon-wrap">
                <img src="../plopp/assets/coin.png" alt="Koin" class="r-icon-img">
              </span>
              <span class="r-text">+30 Koin</span>
            </div>
            <div class="reward-pill reward-xp">
              <span class="r-icon-wrap">
                <img src="../plopp/assets/xp_icon.png" alt="XP" class="r-icon-img">
              </span>
              <span class="r-text">+20 XP</span>
            </div>
          </div>
          
          <div class="result-buttons-row">
            <button class="btn-jawaban btn-continue" id="btnFinishSurvey">
              MASUK KE DASHBOARD
            </button>
          </div>
        </div>

        <!-- Locked Date Screen for Kuisioner Akhir (< 28/08/2026) -->
        <div class="locked-content hidden" id="lockedContent">
          <div class="result-mascot">
            <img src="logo.png" alt="Think Bin" class="result-logo-img">
          </div>
          <h2 class="result-title" style="margin-top: 14px;">Kuisioner Akhir Belum Dibuka</h2>
          <p class="result-feedback" style="margin-top: 8px;">
            Kuisioner Akhir baru dapat dikerjakan mulai tanggal <strong>28 Agustus 2026 (28/08/2026)</strong>.
          </p>
          <div class="survey-badge-pill" style="display: inline-block; margin: 14px auto 20px auto;">
            Jadwal Buka: 28 Agustus 2026
          </div>
          <div class="result-buttons-row">
            <button class="btn-jawaban btn-continue" id="btnBackToLearning">
              KEMBALI KE PETA BELAJAR
            </button>
          </div>
        </div>

      </main>

      <!-- Exact Cartoon Hands Image Overlay Holding Paper at Bottom -->
      <div class="hands-container">
        <img src="../quiz/hands.png" alt="Hands holding paper" class="hands-overlay-img">
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
