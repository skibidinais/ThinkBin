<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinkBin - My Learning App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="app-nav">
    <button class="nav-btn active" data-screen="learning-map">🗺️ Learning Map</button>
    <button class="nav-btn" data-screen="bacaan">📖 Bacaan</button>
    <button class="nav-btn" data-screen="quiz">📝 Quiz</button>

    <button class="nav-btn" data-screen="toko">🛍️ Toko</button>

    <span class="nav-divider"></span>
    <button class="nav-btn" data-screen="celeb-a">🎉 Celeb A</button>
    <button class="nav-btn" data-screen="celeb-c">🎉 Celeb C</button>

  <main class="app-stage">

<script src="main.js"></script>

</html>
